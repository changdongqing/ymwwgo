data:
  database:
    driver: "postgres"
    source: "host=postgres port=5432 user=postgres password=*Abcd123456 dbname=gwa sslmode=disable"
#    driver: "mysql"
#    source: "root:*Abcd123456@tcp(localhost:3306)/gwa?parseTime=true&charset=utf8mb4&loc=Asia%2FShanghai"
    migrate: true
#    migrate 开关语义（见 docs/database/design/ent-goose-migrations.md）：
#    true  = 启动时自动执行内嵌 goose 版本化迁移（推荐，单实例部署）
#    false = 启动不做任何 DDL，由部署链先执行 cmd/migrate up（多副本/DBA 管控场景）
#    结构变更一律在 internal/data/migrations/ 新增迁移文件，历史的 Ent 自动迁移已移除。
    debug: false
    enable_trace: false
    enable_metrics: false
    max_idle_connections: 25
    max_open_connections: 25
    connection_max_lifetime: 300s

  redis:
    addr: "redis:6379"
    password: "*Abcd123456"
    dial_timeout: 10s
    read_timeout: 0.4s
    write_timeout: 0.6s
