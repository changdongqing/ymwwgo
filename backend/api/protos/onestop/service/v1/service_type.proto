syntax = "proto3";

package onestop.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// 一站式服务类型管理服务
//
// 服务类型是四级分类字典（大类 → 中类 → 小类 → 细类），编码规则见
// docs/leixing/biaodan/README.md：编码为 2/4/6/8 位数字字符串，位数即层级，
// 上级编码 = 本编码去掉末两位。本服务是一站式服务（onestop）独立 Go module
// 的第一个功能，后续服务对象、工单对象及其跟进都在该 module 内扩展。
service OneStopServiceTypeService {
  // 查询服务类型列表
  rpc List (pagination.PagingRequest) returns (ListServiceTypeResponse) {
    option (google.api.http) = {
      get: "/admin/v1/onestop/service-types"
    };
  }

  // 查询服务类型详情
  rpc Get (GetServiceTypeRequest) returns (ServiceType) {
    option (google.api.http) = {
      get: "/admin/v1/onestop/service-types/{id}"
    };
  }

  // 创建服务类型
  rpc Create (CreateServiceTypeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/onestop/service-types"
      body: "*"
    };
  }

  // 更新服务类型
  rpc Update (UpdateServiceTypeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/onestop/service-types/{id}"
      body: "*"
    };
  }

  // 删除服务类型
  rpc Delete (DeleteServiceTypeRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/onestop/service-types/{id}"
    };
  }

  // 查询类别的生效履约配置（细类→小类回退解析后的完整视图）：
  // 发起端表单预填与工单创建快照共用同一解析口径。
  rpc GetEffectiveConfig (GetEffectiveConfigRequest) returns (EffectiveServiceConfig) {
    option (google.api.http) = {
      get: "/admin/v1/onestop/service-types/{id}/effective-config"
    };
  }
}

// 服务层级：大类 / 中类 / 小类 / 细类（与编码位数 2/4/6/8 一一对应）
enum Level {
  LEVEL_UNSPECIFIED = 0; // 未指定
  LEVEL_MAJOR = 1; // 大类，2 位编码
  LEVEL_MIDDLE = 2; // 中类，4 位编码
  LEVEL_MINOR = 3; // 小类，6 位编码
  LEVEL_DETAIL = 4; // 细类，8 位编码
}

// 默认优先级：工单派单排序与超时预警加权（0101 报修 / 0106 运送子树）
enum ServicePriority {
  PRIORITY_UNSPECIFIED = 0; // 未指定（按常规处理）
  PRIORITY_NORMAL = 1; // 常规：按队列顺序派发
  PRIORITY_URGENT = 2; // 加急：插队派发、超时预警提前（如急送标本）
  PRIORITY_EMERGENCY = 3; // 特急：立即派发并逐级上报（如电梯困人、危重患者转运）
}

// 温控要求：运送配送的冷链/保温管理（标本、药品、血液、营养餐）
enum TemperatureRequirement {
  TEMP_UNSPECIFIED = 0; // 未指定（按常温处理）
  TEMP_NORMAL = 1; // 常温
  TEMP_COLD = 2; // 冷藏 2-8℃（标本、静配药品、血液制品）
  TEMP_FROZEN = 3; // 冷冻 ≤-18℃（冰冻血浆、冷冻试剂）
  TEMP_WARM = 4; // 保温 ≥60℃（营养餐配送）
}

// 任务触发方式：周期计划的统一开关。按需发起 = 工单由用户/呼叫触发，
// 无周期计划入口；计划生成 = 可挂周期计划（OneStopPeriodicPlanService），
// 任务由后续工单调度器按频率生成（定时班次即计划的 times）。
// 细类未设置回退小类，小类也未设置按 TRIGGER_ON_DEMAND。
enum TriggerMode {
  TRIGGER_UNSPECIFIED = 0; // 未指定（回退上级，最终默认按需）
  TRIGGER_ON_DEMAND = 1; // 按需发起：报修、突发、投诉、应急等事件型服务
  TRIGGER_SCHEDULED = 2; // 计划生成：巡检、维保、日常保洁、消杀、抄表等周期型服务
}

// 履约形态：工单「怎么履约」的开关，与任务触发方式（怎么生单）正交。
// 细类未设置回退小类；两级都空按推导规则（0106 子树→运送；解析后计划
// 生成→计划任务；否则→事件处置），显式设置只处理推导覆盖不了的特例
//（如 010405 被服收发按业务形状归运送）。
enum OrderKind {
  KIND_UNSPECIFIED = 0; // 未指定（回退上级，最终按推导规则）
  KIND_EVENT = 1; // 事件处置：受理→派单→到场→完工→验收（报修/投诉/应急）
  KIND_TASK = 2; // 计划任务：计划生成→逐项执行→确认（维保/巡检/保洁）
  KIND_TRANSPORT = 3; // 运送：取件签收→送达签收（急送/陪检/巡回/押运/被服收发）
}

// 验收项：完工（报修）/送达（运送）确认页逐项核对的 checklist 项
message ServiceAcceptanceItem {
  string name = 1 [
    json_name = "name",
    (gnostic.openapi.v3.property) = { description: "验收项名称（如：数量准确、现场已清理）" }
  ]; // 验收项名称

  bool required = 2 [
    json_name = "required",
    (gnostic.openapi.v3.property) = { description: "是否必检项（false = 提示项，可跳过）" }
  ]; // 是否必检项
}

// 一站式服务类型
message ServiceType {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "服务类型ID" }
  ]; // 服务类型ID

  optional string code = 2 [
    json_name = "code",
    (gnostic.openapi.v3.property) = { description: "服务编码，2/4/6/8 位数字字符串，位数即层级" }
  ]; // 服务编码

  optional string name = 3 [
    json_name = "name",
    (gnostic.openapi.v3.property) = { description: "服务名称" }
  ]; // 服务名称

  optional Level level = 4 [
    json_name = "level",
    (gnostic.openapi.v3.property) = { description: "服务层级（大类/中类/小类/细类）" }
  ]; // 服务层级

  optional uint32 parent_id = 5 [
    json_name = "parentId",
    (gnostic.openapi.v3.property) = { description: "上级服务类型ID，大类为空" }
  ]; // 上级服务类型ID

  optional string description = 6 [
    json_name = "description",
    (gnostic.openapi.v3.property) = { description: "描述" }
  ]; // 描述

  optional bool is_enabled = 7 [
    json_name = "isEnabled",
    (gnostic.openapi.v3.property) = {description: "是否启用"}
  ]; // 是否启用

  // 8 号字段原为 sort_order，已移除：类型列表固定按 code 升序，
  // 不再维护独立排序值（保留字段号，避免历史客户端误复用）。
  reserved 8;
  reserved "sort_order";

  // 9/17/18 号字段原为 repair_post / inspection_items / transport_post，
  // 统一配置模板期退役：岗位合并为 execution_post（25），巡检项目库泛化为
  // standard_items（26）。保留字段号，避免历史客户端误复用。
  reserved 9, 17, 18;
  reserved "repair_post", "inspection_items", "transport_post";

  // —— 统一履约配置模板（所有小类/细类两级可填，全部可空，未配置 = NULL）——
  // 四组：派单与时效（岗位/优先级/时限/工时）、作业标准（指导/语句/工具/耗材）、
  // 验收方案（方式/验收项）、专项属性（温控/审批/物品细目/标准项目库）。
  // 存储层不限子树，可见性与文案由前端展示矩阵按中类驱动；消费方为后续工单对象
  // （派单/SLA 预警/绩效工时核算）与发起端（快捷语句/语义归型语料）。

  optional double standard_work_hours = 10 [
    json_name = "standardWorkHours",
    (gnostic.openapi.v3.property) = { description: "标准工时（小时）：单次作业标准人时，绩效与负载核算用" }
  ]; // 标准工时（小时）

  optional uint32 response_time_limit = 11 [
    json_name = "responseTimeLimit",
    (gnostic.openapi.v3.property) = { description: "响应时限（分钟）：受理到到场/取件/处置的 SLA（文案按业态）" }
  ]; // 响应时限（分钟）

  optional uint32 completion_time_limit = 12 [
    json_name = "completionTimeLimit",
    (gnostic.openapi.v3.property) = { description: "完成时限（分钟）：受理到完工/送达/办结的 SLA（文案按业态）" }
  ]; // 完成时限（分钟）

  optional string guidance = 13 [
    json_name = "guidance",
    (gnostic.openapi.v3.property) = { description: "标准指导说明：作业 SOP 与安全注意事项" }
  ]; // 标准指导说明

  repeated string common_phrases = 14 [
    json_name = "commonPhrases",
    (gnostic.openapi.v3.property) = { description: "常见语句清单：发起端快捷语句，兼作语义归型语料" }
  ]; // 常见语句清单

  repeated string standard_tools = 15 [
    json_name = "standardTools",
    (gnostic.openapi.v3.property) = { description: "服务标准工具清单：出工标配工具/装备" }
  ]; // 服务标准工具清单

  repeated string spare_parts = 16 [
    json_name = "spareParts",
    (gnostic.openapi.v3.property) = { description: "常用备件/耗材清单：出工常备，配合库存领用" }
  ]; // 常用备件/耗材清单

  // —— 验收方案（通用履约）——
  // 报修场景 = 完工验收（签名/拍照 + 故障已修复/现场已清理），运送场景 =
  // 交接签收（扫码/双签 + 数量准确/包装完好/温度达标），客服场景 = 办结回访。

  optional ServicePriority default_priority = 22 [
    json_name = "defaultPriority",
    (gnostic.openapi.v3.property) = { description: "默认优先级：派单排序与超时预警加权（细类可覆盖小类，如急送标本=加急、电梯困人=特急）" }
  ]; // 默认优先级

  repeated string acceptance_modes = 23 [
    json_name = "acceptanceModes",
    (gnostic.openapi.v3.property) = { description: "验收方式（多选）：ACCEPT_SIGN 签名确认 / ACCEPT_SCAN 扫码核对 / ACCEPT_PHOTO 拍照留证 / ACCEPT_DUAL 双人验收，值域由服务层校验" }
  ]; // 验收方式（多选）

  repeated ServiceAcceptanceItem acceptance_items = 24 [
    json_name = "acceptanceItems",
    (gnostic.openapi.v3.property) = { description: "验收项清单：完工（报修）/送达（运送）确认页逐项核对的 checklist" }
  ]; // 验收项清单

  // —— 专项属性（推荐填写子树见展示矩阵；存储层不限子树）——

  optional TemperatureRequirement temperature_requirement = 19 [
    json_name = "temperatureRequirement",
    (gnostic.openapi.v3.property) = { description: "温控要求：常温/冷藏 2-8℃/冷冻/保温（标本、药品、营养餐等冷链管理，推荐 0106 运送子树）" }
  ]; // 温控要求

  optional bool requires_approval = 20 [
    json_name = "requiresApproval",
    (gnostic.openapi.v3.property) = { description: "是否需事前审批（搬入搬出押运、动火作业、资源申请等管控类服务）" }
  ]; // 是否需事前审批

  repeated string cargo_types = 21 [
    json_name = "cargoTypes",
    (gnostic.openapi.v3.property) = { description: "运送物品细目清单：该类型承接的物品范围（如：血标本/病理标本/静配药品），推荐 0106 运送配送子树" }
  ]; // 运送物品细目清单

  optional string execution_post = 25 [
    json_name = "executionPost",
    (gnostic.openapi.v3.property) = { description: "执行岗位（派单目标岗位，如：电工/运送员/保洁员）" }
  ]; // 执行岗位

  repeated string standard_items = 26 [
    json_name = "standardItems",
    (gnostic.openapi.v3.property) = { description: "标准作业项目库：周期计划点表模板（巡检点/维保项目单/保洁作业标准）" }
  ]; // 标准作业项目库

  optional TriggerMode trigger_mode = 27 [
    json_name = "triggerMode",
    (gnostic.openapi.v3.property) = { description: "任务触发方式：按需发起（工单由用户/呼叫触发）或计划生成（可挂周期计划，任务按频率生成）；未设置回退上级，默认按需" }
  ]; // 任务触发方式

  optional OrderKind order_kind = 28 [
    json_name = "orderKind",
    (gnostic.openapi.v3.property) = { description: "履约形态：事件处置/计划任务/运送，驱动工单状态机分支与界面面板；未设置回退上级，两级都空按推导规则（0106 子树/计划生成/事件顺序）" }
  ]; // 履约形态

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询服务类型列表 - 回应
message ListServiceTypeResponse {
  repeated ServiceType items = 1;
  uint64 total = 2;
}

// 查询服务类型详情 - 请求
message GetServiceTypeRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器，用于控制返回的字段
}

// 创建服务类型 - 请求
message CreateServiceTypeRequest {
  ServiceType data = 1;
}

// 更新服务类型 - 请求
message UpdateServiceTypeRequest {
  uint32 id = 1;

  ServiceType data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,code,name,level"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 资源不存在时是否新增
}

// 删除服务类型 - 请求
message DeleteServiceTypeRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}

// 查询生效履约配置 - 请求（id 须为小类/细类，其余层级 422）
message GetEffectiveConfigRequest {
  uint32 id = 1 [
    (gnostic.openapi.v3.property) = {description: "服务类型ID（小类/细类）", read_only: true},
    json_name = "id"
  ]; // 服务类型ID
}

// 生效履约配置 - 回应
//
// effective 是解析后的合并视图：单值列（细类为空回退小类）与数组列（整组
// 覆盖或整组继承，不做数组内 merge）都已按「细类 → 小类」回退填齐；
// trigger_mode / order_kind 为解析后的生效值（含推导）。发起端表单预填与
// 工单创建快照共用本接口口径，前端发起弹窗无须自行实现继承链。
message EffectiveServiceConfig {
  ServiceType effective = 1 [
    json_name = "effective",
    (gnostic.openapi.v3.property) = { description: "解析后的生效配置（细类→小类回退已填齐，trigger_mode/order_kind 为解析值）" }
  ]; // 解析后的生效配置
}
