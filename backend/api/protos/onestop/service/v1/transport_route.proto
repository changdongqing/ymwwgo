syntax = "proto3";

package onestop.service.v1;

import "gnostic/openapi/v3/annotations.proto";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

import "pagination/v1/pagination.proto";

// 一站式运送路线管理服务
//
// 运送路线是「运送配送（0106）」类别节点下的列表型子资源（与巡检计划同款
// 模式）：一个类别可挂多条常用路线。路线描述「从哪到哪（起点/终点/途经点）、
// 单程预计多久、是否往返、定时班次何时发班」；调度坐席按路线模板派单，
// 定时班次（departure_times 非空）由后续工单对象按时间点生成定时任务。
service OneStopTransportRouteService {
  // 查询运送路线列表
  rpc List (pagination.PagingRequest) returns (ListTransportRoutesResponse) {
    option (google.api.http) = {
      get: "/admin/v1/onestop/transport-routes"
    };
  }

  // 查询运送路线详情
  rpc Get (GetTransportRouteRequest) returns (TransportRoute) {
    option (google.api.http) = {
      get: "/admin/v1/onestop/transport-routes/{id}"
    };
  }

  // 创建运送路线
  rpc Create (CreateTransportRouteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/admin/v1/onestop/transport-routes"
      body: "*"
    };
  }

  // 更新运送路线
  rpc Update (UpdateTransportRouteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/admin/v1/onestop/transport-routes/{id}"
      body: "*"
    };
  }

  // 删除运送路线
  rpc Delete (DeleteTransportRouteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/admin/v1/onestop/transport-routes/{id}"
    };
  }
}

// 一站式运送路线
message TransportRoute {
  optional uint32 id = 1 [
    json_name = "id",
    (gnostic.openapi.v3.property) = { description: "运送路线ID" }
  ]; // 运送路线ID

  optional string name = 2 [
    json_name = "name",
    (gnostic.openapi.v3.property) = { description: "路线名称（如：静配中心→内科楼病区巡回）" }
  ]; // 路线名称

  optional uint32 service_type_id = 3 [
    json_name = "serviceTypeId",
    (gnostic.openapi.v3.property) = { description: "运送类别ID（0106 运送配送子树的小类/细类）" }
  ]; // 运送类别ID

  optional string origin = 4 [
    json_name = "origin",
    (gnostic.openapi.v3.property) = { description: "起点（取件地，如：静配中心）" }
  ]; // 起点

  optional string destination = 5 [
    json_name = "destination",
    (gnostic.openapi.v3.property) = { description: "终点（送达地，如：内科楼 12 病区）" }
  ]; // 终点

  repeated string via_points = 6 [
    json_name = "viaPoints",
    (gnostic.openapi.v3.property) = { description: "途经点列表（按序途经的中间点，可空）" }
  ]; // 途经点列表

  optional uint32 est_duration_minutes = 7 [
    json_name = "estDurationMinutes",
    (gnostic.openapi.v3.property) = { description: "预计单程时长（分钟，1-1440）：调度 ETA 与超时判定基准" }
  ]; // 预计单程时长（分钟）

  optional bool round_trip = 8 [
    json_name = "roundTrip",
    (gnostic.openapi.v3.property) = { description: "是否往返路线（送达后原路返回起点，如餐车回收）" }
  ]; // 是否往返路线

  repeated string departure_times = 9 [
    json_name = "departureTimes",
    (gnostic.openapi.v3.property) = { description: "定时班次发班时间点列表（HH:mm，每日按点发班）；为空表示按需即时派单" }
  ]; // 定时班次发班时间点列表

  optional bool is_enabled = 18 [
    json_name = "isEnabled",
    (gnostic.openapi.v3.property) = {description: "是否启用"}
  ]; // 是否启用

  optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = {description: "创建者ID"}]; // 创建者ID
  optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = {description: "更新者ID"}]; // 更新者ID
  optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = {description: "删除者用户ID"}]; // 删除者用户ID

  optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = {description: "创建时间"}];// 创建时间
  optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = {description: "更新时间"}];// 更新时间
  optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = {description: "删除时间"}];// 删除时间
}

// 查询运送路线列表 - 回应
message ListTransportRoutesResponse {
  repeated TransportRoute items = 1;
  uint64 total = 2;
}

// 查询运送路线详情 - 请求
message GetTransportRouteRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }

  optional google.protobuf.FieldMask view_mask = 100 [
    json_name = "viewMask",
    (gnostic.openapi.v3.property) = {
      description: "视图字段过滤器，用于控制返回的字段"
    }
  ]; // 视图字段过滤器
}

// 创建运送路线 - 请求
message CreateTransportRouteRequest {
  TransportRoute data = 1;
}

// 更新运送路线 - 请求
message UpdateTransportRouteRequest {
  uint32 id = 1;

  TransportRoute data = 2;

  google.protobuf.FieldMask update_mask = 3 [
    (gnostic.openapi.v3.property) = {
      description: "要更新的字段列表",
      example: {yaml : "id,name,origin"}
    },
    json_name = "updateMask"
  ]; // 要更新的字段列表

  optional bool allow_missing = 4 [
    (gnostic.openapi.v3.property) = {description: "如果设置为true的时候，资源不存在则会新增(插入)，并且在这种情况下`updateMask`字段将会被忽略。"},
    json_name = "allowMissing"
  ]; // 资源不存在时是否新增
}

// 删除运送路线 - 请求
message DeleteTransportRouteRequest {
  oneof query_by {
    uint32 id = 1 [
      (gnostic.openapi.v3.property) = {description: "ID", read_only: true},
      json_name = "id"
    ]; // ID
  }
}
