syntax = "proto3";

package ontology.service.v1;

option go_package = "go-wind-admin/api/gen/go/ontology/service/v1;ontologyv1";

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "ontology/service/v1/ontology.proto";

// 对象属性特征（OWL 2 词汇表七特征；枚举承载声明序 + i18n 锚点，
// 帧内传输仍用特征 IRI 字符串数组——与存储/OWL 词汇表同轨）
enum OntologyPropertyCharacteristic {
    PROPERTY_CHARACTERISTIC_UNSPECIFIED = 0;           // 未指定
    PROPERTY_CHARACTERISTIC_FUNCTIONAL = 1;            // owl:FunctionalProperty（函数性）
    PROPERTY_CHARACTERISTIC_INVERSE_FUNCTIONAL = 2;    // owl:InverseFunctionalProperty（逆函数性）
    PROPERTY_CHARACTERISTIC_TRANSITIVE = 3;            // owl:TransitiveProperty（传递性）
    PROPERTY_CHARACTERISTIC_SYMMETRIC = 4;             // owl:SymmetricProperty（对称性）
    PROPERTY_CHARACTERISTIC_ASYMMETRIC = 5;            // owl:AsymmetricProperty（反对称性）
    PROPERTY_CHARACTERISTIC_REFLEXIVE = 6;             // owl:ReflexiveProperty（自反性）
    PROPERTY_CHARACTERISTIC_IRREFLEXIVE = 7;           // owl:IrreflexiveProperty（反自反性）
}

// 对象属性树节点（owl:topObjectProperty 虚拟根由前端固定渲染，不入库）
message ObjectPropertyTreeNode {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "实体ID" }
    ]; // 实体ID
    optional string iri = 2 [
        json_name = "iri",
        (gnostic.openapi.v3.property) = { description: "完整 IRI" }
    ]; // 完整 IRI
    optional string local_name = 3 [
        json_name = "localName",
        (gnostic.openapi.v3.property) = { description: "局部名" }
    ]; // 局部名
    optional string display_label = 4 [
        json_name = "displayLabel",
        (gnostic.openapi.v3.property) = { description: "显示名（rdfs:label 渲染缓存）" }
    ]; // 显示名
    optional bool deprecated = 5 [
        json_name = "deprecated",
        (gnostic.openapi.v3.property) = { description: "是否废弃（owl:deprecated）" }
    ]; // 是否废弃
    optional uint32 child_count = 6 [
        json_name = "childCount",
        (gnostic.openapi.v3.property) = { description: "真实直接子属性数" }
    ]; // 真实直接子属性数
    repeated ObjectPropertyTreeNode children = 7 [json_name = "children"]; // 子节点
}

// 对象属性（列表项，含注解与聚合列）
message ObjectProperty {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "实体ID" }
    ]; // 实体ID
    optional uint32 ontology_id = 2 [
        json_name = "ontologyId",
        (gnostic.openapi.v3.property) = { description: "所属本体ID" }
    ]; // 所属本体ID
    optional string iri = 3 [
        json_name = "iri",
        (gnostic.openapi.v3.property) = { description: "完整 IRI" }
    ]; // 完整 IRI
    optional string local_name = 4 [
        json_name = "localName",
        (gnostic.openapi.v3.property) = { description: "局部名（创建后不可变）" }
    ]; // 局部名
    optional string display_label = 5 [
        json_name = "displayLabel",
        (gnostic.openapi.v3.property) = { description: "显示名（rdfs:label 渲染缓存）" }
    ]; // 显示名
    optional bool deprecated = 6 [
        json_name = "deprecated",
        (gnostic.openapi.v3.property) = { description: "是否废弃（owl:deprecated）" }
    ]; // 是否废弃
    optional string comment = 7 [
        json_name = "comment",
        (gnostic.openapi.v3.property) = { description: "注释（rdfs:comment 注解公理聚合）" }
    ]; // 注释
    optional uint32 parent_count = 9 [
        json_name = "parentCount",
        (gnostic.openapi.v3.property) = { description: "父属性数（子属性公理以我为主语计数）" }
    ]; // 父属性数
    optional uint32 child_count = 10 [
        json_name = "childCount",
        (gnostic.openapi.v3.property) = { description: "直接子属性数（子属性公理以我为宾语计数）" }
    ]; // 直接子属性数
    repeated string characteristics = 11 [
        json_name = "characteristics",
        (gnostic.openapi.v3.property) = { description: "特征 IRI，按 OntologyPropertyCharacteristic 声明序返回" }
    ]; // 特征 IRI

    optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = { description: "创建者用户ID" }]; // 创建者用户ID
    optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = { description: "更新者用户ID" }]; // 更新者用户ID
    optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = { description: "删除者用户ID" }]; // 删除者用户ID

    optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = { description: "创建时间" }]; // 创建时间
    optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = { description: "更新时间" }]; // 更新时间
    optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = { description: "删除时间" }]; // 删除时间
}

// 属性链（37 型公理行；subject=超属性，成员有序保序、不去重——允许 P∘P）
message ObjectPropertyChain {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "链公理行ID（已存在链才有；新增链无 id）" }
    ]; // 链公理行ID
    repeated uint32 member_ids = 2 [json_name = "memberIds"];          // 有序链成员实体 id（保序，不去重）
    repeated EntityBrief members = 3 [json_name = "members"];          // 链成员简况（与 member_ids 同序）
}

// 查询对象属性树 - 请求
message GetObjectPropertyTreeRequest {
    uint32 ontology_id = 1 [
        json_name = "ontologyId",
        (gnostic.openapi.v3.property) = { description: "本体ID" }
    ]; // 本体ID
}

// 查询对象属性树 - 回应（根列表；owl:topObjectProperty 虚拟根由前端固定渲染）
message ObjectPropertyTreeResponse {
    repeated ObjectPropertyTreeNode roots = 1 [json_name = "roots"];
}

// 查询对象属性列表 - 请求（自定义分页消息，字段从 query 绑定；搜索条件一律 contains；无 root_id——左树点击=定位高亮右表行）
message ListObjectPropertiesRequest {
    uint32 page = 1 [json_name = "page"];                    // 页码，1 起
    uint32 page_size = 2 [json_name = "pageSize"];           // 每页条数
    uint32 ontology_id = 3 [json_name = "ontologyId"];       // 本体ID（必填）
    string local_name = 4 [json_name = "localName"];         // 局部名，contains 模糊
    string display_label = 5 [json_name = "displayLabel"];   // 显示名，contains 模糊
    optional bool deprecated = 6 [json_name = "deprecated"]; // 是否废弃，精确
    string order_by = 7 [json_name = "orderBy"];             // JSON 数组字符串，默认 '["-created_at"]'
}

// 查询对象属性列表 - 回应
message ListObjectPropertiesResponse {
    repeated ObjectProperty items = 1;
    uint64 total = 2;
}

// 查询对象属性 frame 详情 - 请求
message GetObjectPropertyFrameRequest {
    uint32 id = 1 [json_name = "id"]; // 实体ID
}

// 对象属性 frame 详情（Protégé Object Property 描述视图对应物；base_version 供乐观锁回传）
message ObjectPropertyFrame {
    optional uint32 id = 1 [json_name = "id"];                     // 实体ID
    optional uint32 ontology_id = 2 [json_name = "ontologyId"];    // 所属本体ID
    optional string iri = 3 [json_name = "iri"];                   // 完整 IRI
    optional string local_name = 4 [json_name = "localName"];      // 局部名
    optional string display_label = 5 [json_name = "displayLabel"]; // 显示名
    optional string comment = 6 [json_name = "comment"];           // 注释（rdfs:comment）
    optional bool deprecated = 8 [json_name = "deprecated"];       // 是否废弃（owl:deprecated）
    repeated uint32 super_property_ids = 9 [json_name = "superPropertyIds"]; // 父属性ID（保序 sort_order）
    repeated EntityBrief super_properties = 10 [json_name = "superProperties"]; // 父属性简况
    repeated uint32 domain_ids = 11 [json_name = "domainIds"];     // 定义域类ID（多值保序，OWL 交集语义）
    repeated EntityBrief domains = 12 [json_name = "domains"];     // 定义域类简况
    repeated uint32 range_ids = 13 [json_name = "rangeIds"];       // 值域类ID（同上）
    repeated EntityBrief ranges = 14 [json_name = "ranges"];       // 值域类简况
    repeated uint32 inverse_ids = 15 [json_name = "inverseIds"];   // 逆属性伙伴ID（对称伙伴去重后）
    repeated uint32 disjoint_ids = 16 [json_name = "disjointIds"]; // 不相交伙伴ID（对称伙伴去重后）
    optional uint32 equivalent_id = 17 [json_name = "equivalentId"]; // 等价属性ID（V1 单值）
    repeated string characteristics = 18 [json_name = "characteristics"]; // 特征 IRI（按声明序）
    repeated ObjectPropertyChain chains = 19 [json_name = "chains"];      // 属性链（挂本属性为超属性）
    optional uint32 base_version = 20 [json_name = "baseVersion"]; // 本体当前版本，下次提交回传（乐观锁基准）
    repeated AnnotationAssertion annotations = 21 [json_name = "annotations"]; // 自定义注解（内建字段之外，保序；04 期增量）

    optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt"]; // 更新时间
}

// 查询对象属性引用 - 请求
message GetObjectPropertyUsageRequest {
    uint32 id = 1 [json_name = "id"]; // 实体ID
}

// 创建对象属性 - 请求（自定义 RPC：扁平请求体，勿包 { data }——protojson 会把 data 当未知字段丢弃）
message CreateObjectPropertyRequest {
    uint32 ontology_id = 1 [json_name = "ontologyId"];             // 本体ID（必填）
    string local_name = 2 [json_name = "localName"];               // 局部名（必填，创建后不可变）
    optional string display_label = 3 [json_name = "displayLabel"]; // 显示名 → rdfs:label（zh）
    optional string comment = 4 [json_name = "comment"];           // 注释 → rdfs:comment（zh）
    optional bool deprecated = 5 [json_name = "deprecated"];       // 废弃 → owl:deprecated
    repeated uint32 super_property_ids = 6 [json_name = "superPropertyIds"]; // 父属性（多选；空 = 根属性，挂 owl:topObjectProperty）
    repeated uint32 domain_ids = 7 [json_name = "domainIds"];      // 定义域类（多选）
    repeated uint32 range_ids = 8 [json_name = "rangeIds"];        // 值域类（多选）
    repeated uint32 inverse_ids = 9 [json_name = "inverseIds"];    // 逆属性（成对补全由服务端完成）
    repeated uint32 disjoint_ids = 10 [json_name = "disjointIds"]; // 不相交属性（成对补全由服务端完成）
    optional uint32 equivalent_id = 11 [json_name = "equivalentId"]; // 等价属性（V1 单值）
    repeated string characteristics = 12 [json_name = "characteristics"]; // 特征 IRI 数组
    repeated ObjectPropertyChain chains = 13 [json_name = "chains"];      // 属性链（超属性=本属性）
    repeated AnnotationAssertionInput annotations = 14 [json_name = "annotations"]; // 自定义注解（全量提交语义；04 期增量）
}

// 创建对象属性 - 回应（新实体 id + 变更后本体版本）
message CreateObjectPropertyResponse {
    optional uint32 id = 1 [json_name = "id"];                     // 新实体ID
    optional uint32 base_version = 2 [json_name = "baseVersion"];  // 变更后本体版本
}

// 更新对象属性 - 请求（frame 全量提交语义；local_name 忽略——不可变；base_version 缺省 = 跳过乐观锁比对，仅限内部路径）
message UpdateObjectPropertyRequest {
    uint32 id = 1 [json_name = "id"];                              // 实体ID
    optional string display_label = 3 [json_name = "displayLabel"]; // 显示名（缺省 = 不变；空串 = 清空）
    optional string comment = 4 [json_name = "comment"];           // 注释（缺省 = 不变；空串 = 清空）
    optional bool deprecated = 5 [json_name = "deprecated"];       // 废弃（缺省 = 不变；false = 移除断言）
    repeated uint32 super_property_ids = 6 [json_name = "superPropertyIds"]; // 父属性全量
    repeated uint32 domain_ids = 7 [json_name = "domainIds"];      // 定义域全量
    repeated uint32 range_ids = 8 [json_name = "rangeIds"];        // 值域全量
    repeated uint32 inverse_ids = 9 [json_name = "inverseIds"];    // 逆属性全量
    repeated uint32 disjoint_ids = 10 [json_name = "disjointIds"]; // 不相交全量
    optional uint32 equivalent_id = 11 [json_name = "equivalentId"]; // 等价属性（缺省 = 不变；0 = 清空；V1 单值）
    repeated string characteristics = 12 [json_name = "characteristics"]; // 特征 IRI 全量
    repeated ObjectPropertyChain chains = 13 [json_name = "chains"];      // 属性链全量（含 id 未变不动 / 变更换行 / 无 id 增 / 缺 id 删）
    optional uint32 base_version = 14 [json_name = "baseVersion"]; // 乐观锁基准
    repeated AnnotationAssertionInput annotations = 15 [json_name = "annotations"]; // 自定义注解全量（nil/缺失/空数组统一 = 清空；04 期增量）
}

// 删除对象属性 - 请求（force=true 级联移除引用公理，子属性自动变根属性）
message DeleteObjectPropertyRequest {
    uint32 id = 1 [json_name = "id"];                     // 实体ID
    optional uint32 base_version = 2 [json_name = "baseVersion"]; // 乐观锁基准
    optional bool force = 3 [json_name = "force"];        // 强制删除（默认 false：被引用即拒绝 ENTITY_IN_USE）
}

// 对象属性管理服务（源领域：只定义消息与 rpc，HTTP 路由在 admin 门面挂载）
service OntologyObjectPropertyService {
    // 查询对象属性全量树
    rpc Tree (GetObjectPropertyTreeRequest) returns (ObjectPropertyTreeResponse) {}

    // 分页查询对象属性列表
    rpc List (ListObjectPropertiesRequest) returns (ListObjectPropertiesResponse) {}

    // 查询对象属性 frame 详情
    rpc Frame (GetObjectPropertyFrameRequest) returns (ObjectPropertyFrame) {}

    // 查询对象属性引用明细
    rpc Usage (GetObjectPropertyUsageRequest) returns (EntityUsage) {}

    // 创建对象属性（公理事务管线）
    rpc Create (CreateObjectPropertyRequest) returns (CreateObjectPropertyResponse) {}

    // 更新对象属性（frame 全量提交，公理事务管线）
    rpc Update (UpdateObjectPropertyRequest) returns (google.protobuf.Empty) {}

    // 删除对象属性（公理事务管线）
    rpc Delete (DeleteObjectPropertyRequest) returns (google.protobuf.Empty) {}
}
