syntax = "proto3";

package ontology.service.v1;

option go_package = "go-wind-admin/api/gen/go/ontology/service/v1;ontologyv1";

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "ontology/service/v1/ontology.proto";

// 本体类树节点（全量树与骨架树共用；owl:Thing 虚拟根由前端固定渲染，不入库）
message OntologyClassTreeNode {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "实体ID" }
    ]; // 实体ID
    optional string iri = 2 [
        json_name = "iri",
        (gnostic.openapi.v3.property) = { description: "完整 IRI" }
    ]; // 完整 IRI
    optional string local_name = 3 [
        json_name = "localName",
        (gnostic.openapi.v3.property) = { description: "局部名" }
    ]; // 局部名
    optional string display_label = 4 [
        json_name = "displayLabel",
        (gnostic.openapi.v3.property) = { description: "显示名（rdfs:label 渲染缓存）" }
    ]; // 显示名
    optional bool deprecated = 5 [
        json_name = "deprecated",
        (gnostic.openapi.v3.property) = { description: "是否废弃（owl:deprecated）" }
    ]; // 是否废弃
    optional uint32 child_count = 6 [
        json_name = "childCount",
        (gnostic.openapi.v3.property) = { description: "真实直接子类数（骨架树被剪枝时与 children 数量存在差值，前端据此渲染 +N 角标）" }
    ]; // 真实直接子类数
    repeated OntologyClassTreeNode children = 7 [json_name = "children"]; // 子节点（骨架树已剪枝）
}

// 本体类（列表项，含注解与聚合列）
message OntologyClass {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "实体ID" }
    ]; // 实体ID
    optional uint32 ontology_id = 2 [
        json_name = "ontologyId",
        (gnostic.openapi.v3.property) = { description: "所属本体ID" }
    ]; // 所属本体ID
    optional string iri = 3 [
        json_name = "iri",
        (gnostic.openapi.v3.property) = { description: "完整 IRI" }
    ]; // 完整 IRI
    optional string local_name = 4 [
        json_name = "localName",
        (gnostic.openapi.v3.property) = { description: "局部名（创建后不可变）" }
    ]; // 局部名
    optional string display_label = 5 [
        json_name = "displayLabel",
        (gnostic.openapi.v3.property) = { description: "显示名（rdfs:label 渲染缓存）" }
    ]; // 显示名
    optional bool deprecated = 6 [
        json_name = "deprecated",
        (gnostic.openapi.v3.property) = { description: "是否废弃（owl:deprecated）" }
    ]; // 是否废弃
    optional string comment = 7 [
        json_name = "comment",
        (gnostic.openapi.v3.property) = { description: "注释（rdfs:comment 注解公理聚合）" }
    ]; // 注释
    optional string notation = 8 [
        json_name = "notation",
        (gnostic.openapi.v3.property) = { description: "编码（skos:notation 注解公理聚合）" }
    ]; // 编码
    optional uint32 parent_count = 9 [
        json_name = "parentCount",
        (gnostic.openapi.v3.property) = { description: "父类数（子类公理以我为主语计数）" }
    ]; // 父类数
    optional uint32 child_count = 10 [
        json_name = "childCount",
        (gnostic.openapi.v3.property) = { description: "直接子类数（子类公理以我为宾语计数）" }
    ]; // 直接子类数
    optional uint32 disjoint_count = 11 [
        json_name = "disjointCount",
        (gnostic.openapi.v3.property) = { description: "不相交数（不相交公理以我为主语计数，成对存储不双倍）" }
    ]; // 不相交数

    optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = { description: "创建者用户ID" }]; // 创建者用户ID
    optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = { description: "更新者用户ID" }]; // 更新者用户ID
    optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = { description: "删除者用户ID" }]; // 删除者用户ID

    optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = { description: "创建时间" }]; // 创建时间
    optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = { description: "更新时间" }]; // 更新时间
    optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = { description: "删除时间" }]; // 删除时间
}

// 查询本体类树 - 请求
message GetOntologyClassTreeRequest {
    uint32 ontology_id = 1 [
        json_name = "ontologyId",
        (gnostic.openapi.v3.property) = { description: "本体ID" }
    ]; // 本体ID
}

// 查询本体类树 - 回应（根列表；owl:Thing 虚拟根由前端固定渲染）
message OntologyClassTreeResponse {
    repeated OntologyClassTreeNode roots = 1 [json_name = "roots"];
}

// 查询本体类骨架树 - 回应（深层无子叶子剪枝，节点带 child_count 供 +N 角标）
message OntologyClassNavTreeResponse {
    repeated OntologyClassTreeNode roots = 1 [json_name = "roots"];
}

// 查询本体类列表 - 请求（自定义分页消息，字段从 query 绑定；搜索条件一律 contains）
message ListOntologyClassesRequest {
    uint32 page = 1 [json_name = "page"];                    // 页码，1 起
    uint32 page_size = 2 [json_name = "pageSize"];           // 每页条数
    uint32 ontology_id = 3 [json_name = "ontologyId"];       // 本体ID（必填）
    string local_name = 4 [json_name = "localName"];         // 局部名，contains 模糊
    string display_label = 5 [json_name = "displayLabel"];   // 显示名，contains 模糊
    optional bool deprecated = 6 [json_name = "deprecated"]; // 是否废弃，精确
    uint32 root_id = 7 [json_name = "rootId"];               // 子树范围：服务端算后代闭包（含自身）；0 = 不过滤
    string order_by = 8 [json_name = "orderBy"];             // JSON 数组字符串，默认 '["-created_at"]'
}

// 查询本体类列表 - 回应
message ListOntologyClassesResponse {
    repeated OntologyClass items = 1;
    uint64 total = 2;
}

// 查询本体类 frame 详情 - 请求
message GetOntologyClassFrameRequest {
    uint32 id = 1 [json_name = "id"]; // 实体ID
}

// 本体类 frame 详情（Protégé 类描述视图对应物；base_version 供乐观锁回传）
message OntologyClassFrame {
    optional uint32 id = 1 [json_name = "id"];                   // 实体ID
    optional uint32 ontology_id = 2 [json_name = "ontologyId"];  // 所属本体ID
    optional string iri = 3 [json_name = "iri"];                 // 完整 IRI
    optional string local_name = 4 [json_name = "localName"];    // 局部名
    optional string display_label = 5 [json_name = "displayLabel"]; // 显示名
    optional string comment = 6 [json_name = "comment"];         // 注释（rdfs:comment）
    optional string notation = 7 [json_name = "notation"];       // 编码（skos:notation）
    optional bool deprecated = 8 [json_name = "deprecated"];     // 是否废弃（owl:deprecated）
    repeated uint32 parent_ids = 9 [json_name = "parentIds"];    // 父类ID（保序 sort_order）
    repeated EntityBrief parents = 10 [json_name = "parents"];   // 父类简况
    repeated uint32 disjoint_ids = 11 [json_name = "disjointIds"]; // 不相交伙伴ID（对称伙伴去重后）
    optional uint32 equivalent_id = 12 [json_name = "equivalentId"]; // 等价类ID（V1 单值）
    optional uint32 base_version = 13 [json_name = "baseVersion"];   // 本体当前版本，下次提交回传（乐观锁基准）
    repeated AnnotationAssertion annotations = 14 [json_name = "annotations"]; // 自定义注解（内建字段之外，保序；04 期增量）

    optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt"]; // 更新时间
}

// 查询本体类引用 - 请求
message GetOntologyClassUsageRequest {
    uint32 id = 1 [json_name = "id"]; // 实体ID
}
// 引用明细复用公共段 EntityUsage / EntityUsageRef（02 期从本文件上移泛化，类/属性接口共用）。

// 创建本体类 - 请求（自定义 RPC：扁平请求体，勿包 { data }——protojson 会把 data 当未知字段丢弃）
message CreateOntologyClassRequest {
    uint32 ontology_id = 1 [json_name = "ontologyId"];             // 本体ID（必填）
    string local_name = 2 [json_name = "localName"];               // 局部名（必填 ≤255，创建后不可变）
    optional string display_label = 3 [json_name = "displayLabel"]; // 显示名 → rdfs:label（zh）
    optional string comment = 4 [json_name = "comment"];           // 注释 → rdfs:comment（zh）
    optional string notation = 5 [json_name = "notation"];         // 编码 → skos:notation，[A-Za-z0-9_-]+
    optional bool deprecated = 6 [json_name = "deprecated"];       // 废弃 → owl:deprecated
    repeated uint32 parent_ids = 7 [json_name = "parentIds"];      // 父类（多选；空 = 根类，挂 owl:Thing）
    repeated uint32 disjoint_ids = 8 [json_name = "disjointIds"];  // 不相交类（成对补全由服务端完成）
    optional uint32 equivalent_id = 9 [json_name = "equivalentId"]; // 等价类（V1 单值）
    repeated AnnotationAssertionInput annotations = 10 [json_name = "annotations"]; // 自定义注解（全量提交语义；04 期增量）
}

// 创建本体类 - 回应（新实体 id + 变更后本体版本，前端创建后选中新节点）
message CreateOntologyClassResponse {
    optional uint32 id = 1 [json_name = "id"];                     // 新实体ID
    optional uint32 base_version = 2 [json_name = "baseVersion"];  // 变更后本体版本
}

// 更新本体类 - 请求（frame 全量提交语义；local_name 忽略——不可变；base_version 缺省 = 跳过乐观锁比对，仅限内部路径）
message UpdateOntologyClassRequest {
    uint32 id = 1 [json_name = "id"];                              // 实体ID
    optional string display_label = 3 [json_name = "displayLabel"]; // 显示名（缺省 = 不变；空串 = 清空；protojson 无法区分 null 与缺省，见设计文档 §8.1 #19）
    optional string comment = 4 [json_name = "comment"];           // 注释（缺省 = 不变；空串 = 清空）
    optional string notation = 5 [json_name = "notation"];         // 编码（缺省 = 不变；空串 = 清空）
    optional bool deprecated = 6 [json_name = "deprecated"];       // 废弃（缺省 = 不变；false = 移除断言）
    repeated uint32 parent_ids = 7 [json_name = "parentIds"];      // 父类全量
    repeated uint32 disjoint_ids = 8 [json_name = "disjointIds"];  // 不相交全量
    optional uint32 equivalent_id = 9 [json_name = "equivalentId"]; // 等价类（缺省 = 不变；0 = 清空；V1 单值）
    optional uint32 base_version = 10 [json_name = "baseVersion"]; // 乐观锁基准
    repeated AnnotationAssertionInput annotations = 11 [json_name = "annotations"]; // 自定义注解全量（nil/缺失/空数组统一 = 清空；04 期增量）
}

// 删除本体类 - 请求（force=true 级联移除引用公理，子类自动变根类）
message DeleteOntologyClassRequest {
    uint32 id = 1 [json_name = "id"];                     // 实体ID
    optional uint32 base_version = 2 [json_name = "baseVersion"]; // 乐观锁基准
    optional bool force = 3 [json_name = "force"];        // 强制删除（默认 false：被引用即拒绝 ENTITY_IN_USE）
}

// 本体类管理服务（源领域：只定义消息与 rpc，HTTP 路由在 admin 门面挂载）
service OntologyClassService {
    // 查询本体类全量树
    rpc Tree (GetOntologyClassTreeRequest) returns (OntologyClassTreeResponse) {}

    // 查询本体类骨架树（深层无子叶子剪枝）
    rpc NavTree (GetOntologyClassTreeRequest) returns (OntologyClassNavTreeResponse) {}

    // 分页查询本体类列表
    rpc List (ListOntologyClassesRequest) returns (ListOntologyClassesResponse) {}

    // 查询本体类 frame 详情
    rpc Frame (GetOntologyClassFrameRequest) returns (OntologyClassFrame) {}

    // 查询本体类引用明细（复用公共段 EntityUsage）
    rpc Usage (GetOntologyClassUsageRequest) returns (EntityUsage) {}

    // 创建本体类（公理事务管线）
    rpc Create (CreateOntologyClassRequest) returns (CreateOntologyClassResponse) {}

    // 更新本体类（frame 全量提交，公理事务管线）
    rpc Update (UpdateOntologyClassRequest) returns (google.protobuf.Empty) {}

    // 删除本体类（公理事务管线）
    rpc Delete (DeleteOntologyClassRequest) returns (google.protobuf.Empty) {}
}
