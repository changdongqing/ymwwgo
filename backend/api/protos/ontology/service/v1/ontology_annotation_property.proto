syntax = "proto3";

package ontology.service.v1;

option go_package = "go-wind-admin/api/gen/go/ontology/service/v1;ontologyv1";

import "gnostic/openapi/v3/annotations.proto";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "ontology/service/v1/ontology.proto";

// 注解属性树节点（owl:topAnnotationProperty 虚拟根由前端固定渲染，不入库）
message AnnotationPropertyTreeNode {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "实体ID" }
    ]; // 实体ID
    optional string iri = 2 [
        json_name = "iri",
        (gnostic.openapi.v3.property) = { description: "完整 IRI" }
    ]; // 完整 IRI
    optional string local_name = 3 [
        json_name = "localName",
        (gnostic.openapi.v3.property) = { description: "局部名" }
    ]; // 局部名
    optional string display_label = 4 [
        json_name = "displayLabel",
        (gnostic.openapi.v3.property) = { description: "显示名（rdfs:label 渲染缓存）" }
    ]; // 显示名
    optional bool deprecated = 5 [
        json_name = "deprecated",
        (gnostic.openapi.v3.property) = { description: "是否废弃（owl:deprecated）" }
    ]; // 是否废弃
    optional uint32 child_count = 6 [
        json_name = "childCount",
        (gnostic.openapi.v3.property) = { description: "真实直接子属性数" }
    ]; // 真实直接子属性数
    repeated AnnotationPropertyTreeNode children = 7 [json_name = "children"]; // 子节点
}

// 注解属性（列表项，含聚合列）。
// 与数据属性的差异（OWL 2 语言约束的同构减法，04 号文档 §2.7）：无特征/值域/等价/不相交列。
message AnnotationProperty {
    optional uint32 id = 1 [
        json_name = "id",
        (gnostic.openapi.v3.property) = { description: "实体ID" }
    ]; // 实体ID
    optional uint32 ontology_id = 2 [
        json_name = "ontologyId",
        (gnostic.openapi.v3.property) = { description: "所属本体ID" }
    ]; // 所属本体ID
    optional string iri = 3 [
        json_name = "iri",
        (gnostic.openapi.v3.property) = { description: "完整 IRI" }
    ]; // 完整 IRI
    optional string local_name = 4 [
        json_name = "localName",
        (gnostic.openapi.v3.property) = { description: "局部名（创建后不可变）" }
    ]; // 局部名
    optional string display_label = 5 [
        json_name = "displayLabel",
        (gnostic.openapi.v3.property) = { description: "显示名（rdfs:label 渲染缓存）" }
    ]; // 显示名
    optional bool deprecated = 6 [
        json_name = "deprecated",
        (gnostic.openapi.v3.property) = { description: "是否废弃（owl:deprecated）" }
    ]; // 是否废弃
    optional string comment = 7 [
        json_name = "comment",
        (gnostic.openapi.v3.property) = { description: "注释（rdfs:comment 注解公理聚合）" }
    ]; // 注释
    optional uint32 parent_count = 9 [
        json_name = "parentCount",
        (gnostic.openapi.v3.property) = { description: "父属性数（50 型子注解属性公理以我为主语计数）" }
    ]; // 父属性数
    optional uint32 child_count = 10 [
        json_name = "childCount",
        (gnostic.openapi.v3.property) = { description: "直接子属性数（50 型子注解属性公理以我为宾语计数）" }
    ]; // 直接子属性数

    optional uint32 created_by = 100 [json_name = "createdBy", (gnostic.openapi.v3.property) = { description: "创建者用户ID" }]; // 创建者用户ID
    optional uint32 updated_by = 101 [json_name = "updatedBy", (gnostic.openapi.v3.property) = { description: "更新者用户ID" }]; // 更新者用户ID
    optional uint32 deleted_by = 102 [json_name = "deletedBy", (gnostic.openapi.v3.property) = { description: "删除者用户ID" }]; // 删除者用户ID

    optional google.protobuf.Timestamp created_at = 200 [json_name = "createdAt", (gnostic.openapi.v3.property) = { description: "创建时间" }]; // 创建时间
    optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt", (gnostic.openapi.v3.property) = { description: "更新时间" }]; // 更新时间
    optional google.protobuf.Timestamp deleted_at = 202 [json_name = "deletedAt", (gnostic.openapi.v3.property) = { description: "删除时间" }]; // 删除时间
}

// 查询注解属性树 - 请求
message GetAnnotationPropertyTreeRequest {
    uint32 ontology_id = 1 [
        json_name = "ontologyId",
        (gnostic.openapi.v3.property) = { description: "本体ID" }
    ]; // 本体ID
}

// 查询注解属性树 - 回应（根列表；owl:topAnnotationProperty 虚拟根由前端固定渲染）
message AnnotationPropertyTreeResponse {
    repeated AnnotationPropertyTreeNode roots = 1 [json_name = "roots"];
}

// 查询注解属性列表 - 请求（自定义分页消息，字段从 query 绑定；搜索条件一律 contains；无 root_id——左树点击=定位高亮右表行）
message ListAnnotationPropertiesRequest {
    uint32 page = 1 [json_name = "page"];                    // 页码，1 起
    uint32 page_size = 2 [json_name = "pageSize"];           // 每页条数
    uint32 ontology_id = 3 [json_name = "ontologyId"];       // 本体ID（必填）
    string local_name = 4 [json_name = "localName"];         // 局部名，contains 模糊
    string display_label = 5 [json_name = "displayLabel"];   // 显示名，contains 模糊
    optional bool deprecated = 6 [json_name = "deprecated"]; // 是否废弃，精确
    string order_by = 7 [json_name = "orderBy"];             // JSON 数组字符串，默认 '["-created_at"]'
}

// 查询注解属性列表 - 回应
message ListAnnotationPropertiesResponse {
    repeated AnnotationProperty items = 1;
    uint64 total = 2;
}

// 查询注解属性 frame 详情 - 请求
message GetAnnotationPropertyFrameRequest {
    uint32 id = 1 [json_name = "id"]; // 实体ID
}

// 注解属性 frame 详情（Protégé Annotation Property 描述视图对应物；base_version 供乐观锁回传）。
// 无定义域/值域/特征/等价/不相交分区——OWL 2 不给注解属性任何逻辑结构（04 号文档 §1.3）；
// annotations 为自定义注解区（100 型 object_id 路径），注解属性自身也可挂注解（递归）。
message AnnotationPropertyFrame {
    optional uint32 id = 1 [json_name = "id"];                     // 实体ID
    optional uint32 ontology_id = 2 [json_name = "ontologyId"];    // 所属本体ID
    optional string iri = 3 [json_name = "iri"];                   // 完整 IRI
    optional string local_name = 4 [json_name = "localName"];      // 局部名
    optional string display_label = 5 [json_name = "displayLabel"]; // 显示名
    optional string comment = 6 [json_name = "comment"];           // 注释（rdfs:comment）
    optional bool deprecated = 8 [json_name = "deprecated"];       // 是否废弃（owl:deprecated）
    repeated uint32 super_property_ids = 9 [json_name = "superPropertyIds"]; // 父属性ID（保序 sort_order）
    repeated EntityBrief super_properties = 10 [json_name = "superProperties"]; // 父属性简况
    repeated AnnotationAssertion annotations = 11 [json_name = "annotations"]; // 自定义注解（内建字段之外，保序）
    optional uint32 base_version = 12 [json_name = "baseVersion"]; // 本体当前版本，下次提交回传（乐观锁基准）

    optional google.protobuf.Timestamp updated_at = 201 [json_name = "updatedAt"]; // 更新时间
}

// 查询注解属性引用 - 请求
message GetAnnotationPropertyUsageRequest {
    uint32 id = 1 [json_name = "id"]; // 实体ID
}

// 创建注解属性 - 请求（自定义 RPC：扁平请求体，勿包 { data }——protojson 会把 data 当未知字段丢弃）。
// 无 domain/range、无特征、无等价/不相交——OWL 2 不给注解属性逻辑结构（04 号文档 §1.3/§1.4）。
message CreateAnnotationPropertyRequest {
    uint32 ontology_id = 1 [json_name = "ontologyId"];             // 本体ID（必填）
    string local_name = 2 [json_name = "localName"];               // 局部名（必填，创建后不可变）
    optional string display_label = 3 [json_name = "displayLabel"]; // 显示名 → rdfs:label（zh）
    optional string comment = 4 [json_name = "comment"];           // 注释 → rdfs:comment（zh）
    optional bool deprecated = 5 [json_name = "deprecated"];       // 废弃 → owl:deprecated
    repeated uint32 super_property_ids = 6 [json_name = "superPropertyIds"]; // 父属性（多选；空 = 根属性，挂 owl:topAnnotationProperty）
    repeated AnnotationAssertionInput annotations = 7 [json_name = "annotations"]; // 自定义注解（全量提交语义）
}

// 创建注解属性 - 回应（新实体 id + 变更后本体版本）
message CreateAnnotationPropertyResponse {
    optional uint32 id = 1 [json_name = "id"];                     // 新实体ID
    optional uint32 base_version = 2 [json_name = "baseVersion"];  // 变更后本体版本
}

// 更新注解属性 - 请求（frame 全量提交语义；local_name 忽略——不可变；base_version 缺省 = 跳过乐观锁比对，仅限内部路径）
message UpdateAnnotationPropertyRequest {
    uint32 id = 1 [json_name = "id"];                              // 实体ID
    optional string display_label = 3 [json_name = "displayLabel"]; // 显示名（缺省 = 不变；空串 = 清空）
    optional string comment = 4 [json_name = "comment"];           // 注释（缺省 = 不变；空串 = 清空）
    optional bool deprecated = 5 [json_name = "deprecated"];       // 废弃（缺省 = 不变；false = 移除断言）
    repeated uint32 super_property_ids = 6 [json_name = "superPropertyIds"]; // 父属性全量
    repeated AnnotationAssertionInput annotations = 7 [json_name = "annotations"]; // 自定义注解全量（nil/缺失/空数组统一 = 清空）
    optional uint32 base_version = 8 [json_name = "baseVersion"];  // 乐观锁基准
}

// 删除注解属性 - 请求（force=true 级联移除引用公理：50 子属性边 + 他人挂的自定义注解断言；子属性自动变根属性）
message DeleteAnnotationPropertyRequest {
    uint32 id = 1 [json_name = "id"];                     // 实体ID
    optional uint32 base_version = 2 [json_name = "baseVersion"]; // 乐观锁基准
    optional bool force = 3 [json_name = "force"];        // 强制删除（默认 false：被引用即拒绝 ENTITY_IN_USE）
}

// 注解属性管理服务（源领域：只定义消息与 rpc，HTTP 路由在 admin 门面挂载）
service OntologyAnnotationPropertyService {
    // 查询注解属性全量树
    rpc Tree (GetAnnotationPropertyTreeRequest) returns (AnnotationPropertyTreeResponse) {}

    // 分页查询注解属性列表
    rpc List (ListAnnotationPropertiesRequest) returns (ListAnnotationPropertiesResponse) {}

    // 查询注解属性 frame 详情
    rpc Frame (GetAnnotationPropertyFrameRequest) returns (AnnotationPropertyFrame) {}

    // 查询注解属性引用明细
    rpc Usage (GetAnnotationPropertyUsageRequest) returns (EntityUsage) {}

    // 创建注解属性（公理事务管线）
    rpc Create (CreateAnnotationPropertyRequest) returns (CreateAnnotationPropertyResponse) {}

    // 更新注解属性（frame 全量提交，公理事务管线）
    rpc Update (UpdateAnnotationPropertyRequest) returns (google.protobuf.Empty) {}

    // 删除注解属性（公理事务管线）
    rpc Delete (DeleteAnnotationPropertyRequest) returns (google.protobuf.Empty) {}
}
