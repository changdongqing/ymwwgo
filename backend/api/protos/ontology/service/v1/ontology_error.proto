syntax = "proto3";

package ontology.service.v1;

option go_package = "go-wind-admin/api/gen/go/ontology/service/v1;ontologyv1";

import "errors/errors.proto";

// 本体建模错误定义（对齐源项目 1-071-xxx 数字错误码段的语义分段；
// Kratos errors 规范：reason 字符串 + HTTP 数字码，前端按 error.response.data.reason 分流）
enum OntologyErrorReason {
    option (errors.default_code) = 500;

    // ===== 本体文档（源 1-071-000 段）=====
    ONTOLOGY_NOT_FOUND = 0 [(errors.code) = 404];           // 本体不存在
    ONTOLOGY_NAME_DUPLICATE = 1 [(errors.code) = 409];      // 已存在同名本体
    ONTOLOGY_BASE_IRI_INVALID = 2 [(errors.code) = 422];    // 实体命名空间 IRI 不合法
    ONTOLOGY_VERSION_CONFLICT = 3 [(errors.code) = 409];    // 本体已被他人修改（当前版本 {}），请刷新后重试
    ONTOLOGY_IRI_DUPLICATE = 4 [(errors.code) = 409];       // 已存在相同 IRI 的本体

    // ===== 实体（源 1-071-001 段）=====
    ENTITY_NOT_FOUND = 10 [(errors.code) = 404];            // 本体实体不存在
    ENTITY_IRI_DUPLICATE = 11 [(errors.code) = 409];        // 已存在相同 IRI 的实体：{}
    LOCAL_NAME_INVALID = 12 [(errors.code) = 422];          // 局部名不合法：{}
    ENTITY_TYPE_MISMATCH = 13 [(errors.code) = 422];        // 引用实体类型不符或跨本体：{}

    // ===== 公理（源 1-071-002 段）=====
    AXIOM_INVALID = 20 [(errors.code) = 422];               // 公理校验失败：{}
    HIERARCHY_CYCLIC = 21 [(errors.code) = 422];            // 不允许形成继承环：{} 已是 {} 的祖先
    ENTITY_IN_USE = 22 [(errors.code) = 409];               // 实体被 {} 处引用，无法删除

    // 30~39 对象属性（源 1-071-003 段，02 期启用）；40~44 数据属性（源 1-071-004 段，03 期启用）；
    // 60~66 预留 06 个体与赋码；70~74 预留 05 数据类型；80~88 预留 07 OWL 导入导出。
    // 号段对齐源 1-071-003~008 子段，各期文档落地时启用。

    // ===== 对象属性（源 1-071-003 段）=====
    PROPERTY_DOMAIN_INVALID = 30 [(errors.code) = 422];         // 对象属性定义域必须是本体类：{}
    PROPERTY_RANGE_INVALID = 31 [(errors.code) = 422];          // 对象属性值域必须是本体类：{}
    PROPERTY_CHAIN_INVALID = 32 [(errors.code) = 422];          // 属性链不合法：{}（至少两个属性成员，且均为已声明的对象属性）
    PROPERTY_INVERSE_SELF_INVALID = 33 [(errors.code) = 422];   // 属性不能与自身互为逆属性：{}
    PROPERTY_SELF_REFERENCE_INVALID = 34 [(errors.code) = 422]; // 属性不能与自身建立该关系：{}（等价/不相交自引用）
    PROPERTY_CHARACTERISTIC_INVALID = 35 [(errors.code) = 422]; // 未知的对象属性特征：{}
    PROPERTY_TARGET_INVALID = 36 [(errors.code) = 422];         // 引用目标必须是已声明的对象属性：{}

    // ===== 数据属性（源 1-071-004 段）=====
    DATA_PROPERTY_DOMAIN_INVALID = 40 [(errors.code) = 422];         // 数据属性定义域必须是本体类：{}
    DATA_PROPERTY_RANGE_INVALID = 41 [(errors.code) = 422];          // 数据属性值域必须是内建数据类型：{}
    DATA_PROPERTY_SELF_REFERENCE_INVALID = 42 [(errors.code) = 422]; // 属性不能与自身建立该关系：{}（等价/不相交自引用）
    DATA_PROPERTY_TARGET_INVALID = 43 [(errors.code) = 422];         // 引用目标必须是已声明的数据属性：{}
    DATA_PROPERTY_CHARACTERISTIC_INVALID = 44 [(errors.code) = 422]; // 数据属性仅支持函数性特征：{}

    // ===== 注解属性（源 1-071-005 段，04 期）=====
    ANNOTATION_PROPERTY_TARGET_INVALID = 50 [(errors.code) = 422]; // 引用目标必须是已声明的注解属性：{}
        // 父注解属性类型违规 + 自定义注解谓词非本体内注解属性实体 + frame/usage 直查非注解属性实体
    ANNOTATION_VALUE_INVALID = 51 [(errors.code) = 422];           // 注解值不合法：{}
        // 自定义注解值为空白（值长度由 value_text text 列承载，不设上限）

    // ===== 数据类型（源 1-071-007 段，05 期；01 号文档预留段恰 5 槽）=====
    DATATYPE_BASE_INVALID = 70 [(errors.code) = 422];            // 数据类型基类型必须是内建数据类型：{}
        // 基类型白名单外 / facets 非空而 base_iri 缺失 / datatype 实体作基类型（V1 单层派生）
    DATATYPE_FACET_INVALID = 71 [(errors.code) = 422];           // facet 约束不合法：{}
        // facet 名白名单外 / 基类型族不适配 / facet 值词法非法（非负整数列传负数、pattern 非法正则、比较值不在基类型词法空间）
    DATATYPE_FACET_CONFLICT = 72 [(errors.code) = 422];          // facet 约束冲突：{}
        // 静态冲突五规则：min 上下界二选一 / max 上下界二选一 / length 与区间二选一 / min≥max（含 min==max 且任一 exclusive）/ minLength>maxLength
    DATATYPE_RANGE_TARGET_INVALID = 73 [(errors.code) = 422];    // 数据属性值域引用必须是已声明的数据类型：{}
        // 42 行派生轨：IRI 命中实体但类型不符（类/属性实体）或跨本体
    DATATYPE_DEFINITION_JSON_INVALID = 74 [(errors.code) = 422]; // 数据类型定义解析失败：{}
        // 46 行 value_text 非 JSON / 形态不符（直改库脏数据；frame 读取与校验器双拦）
}
