# 后端热重载配置（本地调试用，不进 git）。改 Go/yaml/proto 保存即自动重编译重启，
# 运行的始终是最新代码，无需手动重编镜像或重启。
# 用法：cd backend && air   （air 已安装于 ~/go/bin，不在 PATH 时用全路径）
# 注意：改 *.proto 后需先 `gow api` 重新生成 Go 代码，air 才会感知到生成产物。
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/admin-server ./app/admin/service/cmd/server"
bin = "tmp/admin-server"
# 指向本地覆盖配置目录（容器编排文件 docker-compose.local.yaml 的配套配置）
full_bin = "tmp/admin-server -c /home/chdq/src/github/changdongqing/ymwwgo/backend/app/admin/service/configs.local"
include_ext = ["go", "yaml", "proto"]
include_dir = ["app", "pkg", "api", "onestop"]
exclude_dir = ["tmp"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 3000

[log]
time = true

[misc]
clean_on_exit = true
